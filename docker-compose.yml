version: "3.8"

# ============================================================================
#  SAP Morocco — Early Warning System
#  Airflow -> Ingestion -> MinIO (DataLake) -> Spark -> PyTorch -> PostGIS/FastAPI -> Next.js
# ============================================================================

# Shared configuration for all Airflow services (anchored & reused below).
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.10
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Install the project's runtime deps into the Airflow workers on startup.
    # (For production bake these into a custom image via a Dockerfile.)
    _PIP_ADDITIONAL_REQUIREMENTS: "boto3 psycopg2-binary cdsapi xarray netCDF4 h5netcdf numpy"
    # --- pipeline configuration consumed by producer.py / predictor.py ---
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: sap-datalake
    SERVING_DB_URL: postgresql://sap:sap@postgis:5432/sap_serving
    INFERENCE_DEVICE: cpu
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./backend:/opt/airflow/backend
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  user: "50000:0"
  networks:
    - sap_network
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  # ----------------------------------------------------
  # 2. DATALAKE: MinIO + one-shot bucket creation
  # ----------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: sap_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sap_network

  # Creates the default 'sap-datalake' bucket + the canonical prefixes, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: sap_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sap-datalake &&
      mc cp /dev/null local/sap-datalake/raw/.keep &&
      mc cp /dev/null local/sap-datalake/tensors/.keep &&
      mc cp /dev/null local/sap-datalake/reference/.keep &&
      mc cp /dev/null local/sap-datalake/predictions/.keep &&
      echo 'Bucket sap-datalake ready.';
      "
    networks:
      - sap_network

  # ----------------------------------------------------
  # 3. SERVING DB: PostgreSQL + PostGIS (for FastAPI)
  # ----------------------------------------------------
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sap_postgis
    environment:
      POSTGRES_USER: sap
      POSTGRES_PASSWORD: sap
      POSTGRES_DB: sap_serving
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sap -d sap_serving"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sap_network

  # ----------------------------------------------------
  # 4. ORCHESTRATION: Airflow (metadata DB + webserver + scheduler)
  # ----------------------------------------------------
  airflow-postgres:
    image: postgres:15
    container_name: sap_airflow_postgres
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sap_network

  airflow-init:
    <<: *airflow-common
    container_name: sap_airflow_init
    profiles: ["airflow"]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@sap.local || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: sap_airflow_webserver
    profiles: ["airflow"]
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: sap_airflow_scheduler
    profiles: ["airflow"]
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------
  # 5. FRONTEND: Next.js App
  # ----------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: sap_frontend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules # Prevents local node_modules from overriding container's
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    networks:
      - sap_network

  # ----------------------------------------------------
  # 6. BACKEND: FastAPI App
  # ----------------------------------------------------
  backend:
    image: python:3.10-slim
    container_name: sap_backend
    working_dir: /app
    volumes:
      # Mount backend, project data, and public map JSONs
      - ./backend:/app
      - ./data:/data
      - ./public:/public
    ports:
      - "8000:8000"
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=sap-datalake
      - SERVING_DB_URL=postgresql://sap:sap@postgis:5432/sap_serving
    depends_on:
      - minio
      - postgis
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - sap_network

  # ----------------------------------------------------
  # 7. STREAMING: Spark Processor
  # ----------------------------------------------------
  spark_processor:
    # We use a Jupyter PySpark image because it correctly pre-installs Java 11+, Python, and PySpark
    image: jupyter/pyspark-notebook:python-3.10
    container_name: sap_spark_processor
    user: root
    working_dir: /app
    volumes:
      - ./ingestion:/app
      - ./data:/data
      - ./backend/artifacts:/backend/artifacts
    environment:
      # Spark should upload tensor_live_*.npy to MinIO under tensors/ so the
      # DAG sensor and predictor can pick it up from the DataLake.
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=sap-datalake
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               python spark_processor.py"
    depends_on:
      - minio
    networks:
      - sap_network

  # ----------------------------------------------------
  # 8. JOBS: GFS Producer & Processor
  # Run them on-demand: docker-compose run --rm gfs_producer (or gfs_processor)
  # ----------------------------------------------------
  gfs_producer:
    image: python:3.10-slim
    container_name: sap_gfs_producer
    working_dir: /app
    volumes:
      - ./ingestion:/app
      - ./data:/data
    environment:
      - GFS_SOURCE=auto
    profiles:
      - jobs
    command: >
      sh -c "pip install --no-cache-dir requests confluent-kafka &&
             python gfs_producer.py --no-kafka"
    networks:
      - sap_network

  gfs_processor:
    image: python:3.10-slim
    container_name: sap_gfs_processor
    working_dir: /app
    volumes:
      - ./ingestion:/app
      - ./data:/data
      - ./backend/artifacts:/backend/artifacts
    profiles:
      - jobs
    command: >
      sh -c "apt-get update && apt-get install -y libeccodes0 &&
             pip install --no-cache-dir numpy xarray cfgrib eccodes confluent-kafka &&
             python gfs_processor_runner.py"
    networks:
      - sap_network

  predictor:
    image: python:3.10-slim
    container_name: sap_predictor
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./public:/public
    environment:
      - INFERENCE_DEVICE=cpu
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=sap-datalake
      - SERVING_DB_URL=postgresql://sap:sap@postgis:5432/sap_serving
    profiles:
      - jobs
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python predictor.py"
    networks:
      - sap_network

# ============================================================================
#  Named volumes & shared network
# ============================================================================
volumes:
  minio_data:
  postgis_data:
  airflow_pg_data:
  airflow_logs:

networks:
  sap_network:
    driver: bridge
